spring.application.name=parking-management-system
server.port=${PORT:9080}

# Local development database
spring.datasource.url=jdbc:h2:file:./data/parkingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Configure deployment secrets through environment variables.
parking.jwt.secret=${PARKING_JWT_SECRET}
parking.default-admin.email=${PARKING_ADMIN_EMAIL:}
parking.default-admin.password=${PARKING_ADMIN_PASSWORD:}
parking.default-admin.reset-password-on-startup=${PARKING_ADMIN_RESET_PASSWORD_ON_STARTUP:false}
parking.cors.allowed-origins=${PARKING_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
