spring.application.name=parking-management-system
server.port=9080

# Local development database
spring.datasource.url=jdbc:h2:file:./data/parkingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Override the development key and administrator credentials in deployment.
parking.jwt.secret=${PARKING_JWT_SECRET:local-only-secret-change-before-deployment-32bytes}
parking.default-admin.email=${PARKING_ADMIN_EMAIL:admin@parking.local}
parking.default-admin.password=${PARKING_ADMIN_PASSWORD:ParkGuardAdmin@2026}
parking.default-admin.reset-password-on-startup=${PARKING_ADMIN_RESET_PASSWORD_ON_STARTUP:true}
parking.cors.allowed-origins=${PARKING_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
